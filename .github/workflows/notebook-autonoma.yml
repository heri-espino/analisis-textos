name: Notebook autónoma
on:
  push:
    branches: [proyecto/experimentos]
    paths: ['notebook_autonoma.ipynb', '.github/workflows/notebook-autonoma.yml', 'scripts/verificar_notebook.py']
  workflow_dispatch:
    inputs:
      ejecutar_completa:
        description: 'Ejecutar todos los análisis'
        type: boolean
        default: false
concurrency:
  group: notebook-autonoma-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verificar:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Validar código y ausencia de dependencias locales
        run: |
          $conda = @("$env:USERPROFILE\miniconda3\Scripts\conda.exe", "$env:USERPROFILE\miniforge3\Scripts\conda.exe", "$env:USERPROFILE\anaconda3\Scripts\conda.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $conda) { $conda = (Get-Command conda.exe).Source }
          "CONDA_EXE_PROYECTO=$conda" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $conda run -n analisis-textos python scripts/verificar_notebook.py --sintaxis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prueba real en un directorio independiente
        run: |
          & "$env:CONDA_EXE_PROYECTO" run --no-capture-output -n analisis-textos python scripts/verificar_notebook.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-autonoma
          path: notebook_autonoma.ipynb
      - name: Ejecutar notebook completa
        if: github.event_name == 'push' || inputs.ejecutar_completa
        run: |
          & "$env:CONDA_EXE_PROYECTO" run --no-capture-output -n analisis-textos python scripts/verificar_notebook.py --completa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.ejecutar_completa
        with:
          name: notebook-ejecutada
          path: notebook_autonoma_ejecutada.ipynb

  compatibilidad-python313:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar las versiones declaradas por la notebook
        run: |
          python - <<'PY'
          import ast, json, subprocess, sys
          with open("notebook_autonoma.ipynb", encoding="utf-8") as f:
              nb = json.load(f)
          codigo = "".join(nb["cells"][2]["source"])
          nodo = next(n for n in ast.parse(codigo).body
                      if isinstance(n, ast.Assign) and any(
                          isinstance(t, ast.Name) and t.id == "DEPENDENCIAS" for t in n.targets))
          deps = ast.literal_eval(nodo.value)
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--prefer-binary",
                                 *[f"{k}=={v}" for k,v in deps.items()]])
          PY
      - name: Probar importaciones y ajuste real de UMAP
        env:
          VALIDAR_NOTEBOOK: '1'
        run: |
          python - <<'PY'
          import json
          with open("notebook_autonoma.ipynb", encoding="utf-8") as f:
              nb = json.load(f)
          exec("".join(nb["cells"][2]["source"]))
          from umap import UMAP
          X = np.random.default_rng(42).normal(size=(80, 10))
          Z = UMAP(n_components=2, n_neighbors=15, random_state=42,
                   n_jobs=1).fit_transform(X)
          assert Z.shape == (80, 2) and np.isfinite(Z).all()
          print("Python 3.13: UMAP verificado.")
          PY
